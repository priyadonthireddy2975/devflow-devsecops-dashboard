name: DevFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devflow
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devflow -d devflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests with coverage
        run: mvn -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/devflow
          SPRING_DATASOURCE_USERNAME: devflow
          SPRING_DATASOURCE_PASSWORD: devflow
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    outputs:
      leaks: ${{ steps.count.outputs.leaks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Count findings
        id: count
        if: always()
        run: |
          leaks=0
          if [ -f results.sarif ]; then
            leaks=$(jq '[.runs[].results[]?] | length' results.sarif)
          fi
          echo "leaks=$leaks" >> "$GITHUB_OUTPUT"

  codeql:
    name: SAST (CodeQL ${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  trivy-fs:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.count.outputs.critical }}
      high: ${{ steps.count.outputs.high }}
      medium: ${{ steps.count.outputs.medium }}
      low: ${{ steps.count.outputs.low }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs.json
          ignore-unfixed: true
          exit-code: "0"
      - name: Count findings
        id: count
        run: |
          for sev in critical high medium low; do
            n=$(jq "[.Results[]?.Vulnerabilities[]? | select(.Severity==\"${sev^^}\")] | length" trivy-fs.json)
            echo "$sev=$n" >> "$GITHUB_OUTPUT"
            echo "$sev=$n"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs.json
      - name: Fail on critical vulnerabilities
        run: |
          n=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-fs.json)
          if [ "$n" -gt 0 ]; then echo "::error::$n critical vulnerabilities found"; exit 1; fi

  dependency-check:
    name: Dependency scan (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    outputs:
      ran: ${{ steps.count.outputs.ran }}
      critical: ${{ steps.count.outputs.critical }}
      high: ${{ steps.count.outputs.high }}
      medium: ${{ steps.count.outputs.medium }}
      low: ${{ steps.count.outputs.low }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Dependency-Check
        if: env.NVD_API_KEY != ''
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: devflow
          path: .
          format: JSON
          out: reports
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --disableAssembly
      - name: Count findings
        id: count
        run: |
          report=reports/dependency-check-report.json
          if [ ! -f "$report" ]; then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          echo "critical=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.severity=="CRITICAL")] | length' "$report")" >> "$GITHUB_OUTPUT"
          echo "high=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.severity=="HIGH")] | length' "$report")" >> "$GITHUB_OUTPUT"
          echo "medium=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.severity=="MEDIUM" or .severity=="MODERATE")] | length' "$report")" >> "$GITHUB_OUTPUT"
          echo "low=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.severity=="LOW")] | length' "$report")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports
          if-no-files-found: ignore

  docker:
    name: Docker image (build, scan, publish)
    runs-on: ubuntu-latest
    needs: [build-test, frontend]
    permissions:
      contents: read
      packages: write
    outputs:
      critical: ${{ steps.count.outputs.critical }}
      high: ${{ steps.count.outputs.high }}
      medium: ${{ steps.count.outputs.medium }}
      low: ${{ steps.count.outputs.low }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: devflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devflow:ci
          format: json
          output: trivy-image.json
          ignore-unfixed: true
          exit-code: "0"
      - name: Count findings
        id: count
        run: |
          for sev in critical high medium low; do
            n=$(jq "[.Results[]?.Vulnerabilities[]? | select(.Severity==\"${sev^^}\")] | length" trivy-image.json)
            echo "$sev=$n" >> "$GITHUB_OUTPUT"
            echo "$sev=$n"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.json
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        if: github.event_name == 'push'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build-test, frontend, secrets, codeql, trivy-fs, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger deploy
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

  report:
    name: Report results to DevFlow
    runs-on: ubuntu-latest
    needs: [build-test, frontend, secrets, codeql, trivy-fs, dependency-check, docker]
    if: always() && github.event_name == 'push'
    permissions:
      contents: read
      security-events: read
      actions: read
    env:
      DEVFLOW_URL: ${{ secrets.DEVFLOW_URL }}
      DEVFLOW_API_KEY: ${{ secrets.DEVFLOW_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      BRANCH: ${{ github.ref_name }}
      ACTOR: ${{ github.actor }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      TRIVY_C: ${{ needs.trivy-fs.outputs.critical }}
      TRIVY_H: ${{ needs.trivy-fs.outputs.high }}
      TRIVY_M: ${{ needs.trivy-fs.outputs.medium }}
      TRIVY_L: ${{ needs.trivy-fs.outputs.low }}
      IMG_C: ${{ needs.docker.outputs.critical }}
      IMG_H: ${{ needs.docker.outputs.high }}
      IMG_M: ${{ needs.docker.outputs.medium }}
      IMG_L: ${{ needs.docker.outputs.low }}
      DC_RAN: ${{ needs.dependency-check.outputs.ran }}
      DC_C: ${{ needs.dependency-check.outputs.critical }}
      DC_H: ${{ needs.dependency-check.outputs.high }}
      DC_M: ${{ needs.dependency-check.outputs.medium }}
      DC_L: ${{ needs.dependency-check.outputs.low }}
      LEAKS: ${{ needs.secrets.outputs.leaks }}
    steps:
      - name: Send pipeline run and scan summaries
        run: |
          if [ -z "${DEVFLOW_URL:-}" ] || [ -z "${DEVFLOW_API_KEY:-}" ]; then
            echo "DEVFLOW_URL or DEVFLOW_API_KEY is not set; skipping report."
            exit 0
          fi
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          STARTED=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq .run_started_at)
          FINISHED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ "$FAILED" = "true" ]; then STATUS=FAILED; else STATUS=SUCCESS; fi

          post() {
            curl -fsS -X POST "${DEVFLOW_URL%/}$1" \
              -H "X-API-Key: ${DEVFLOW_API_KEY}" \
              -H "Content-Type: application/json" -d @-
          }

          jq -n --arg repo "$REPO" --argjson id "$RUN_ID" --arg branch "$BRANCH" --arg sha "$SHA" \
            --arg actor "$ACTOR" --arg status "$STATUS" --arg url "$RUN_URL" \
            --arg started "$STARTED" --arg finished "$FINISHED" \
            '{repository:$repo, externalId:$id, name:"DevFlow CI/CD", branch:$branch, commitSha:$sha, actor:$actor, trigger:"push", status:$status, url:$url, startedAt:$started, finishedAt:$finished}' \
            | post /api/runs

          scan() {
            jq -n --arg repo "$REPO" --arg tool "$1" --arg sha "$SHA" --argjson run "$RUN_ID" \
              --argjson c "${2:-0}" --argjson h "${3:-0}" --argjson m "${4:-0}" --argjson l "${5:-0}" --arg url "$RUN_URL" \
              '{repository:$repo, tool:$tool, commitSha:$sha, runExternalId:$run, critical:$c, high:$h, medium:$m, low:$l, reportUrl:$url}' \
              | post /api/scans
          }

          scan "Trivy (dependencies)" "${TRIVY_C:-0}" "${TRIVY_H:-0}" "${TRIVY_M:-0}" "${TRIVY_L:-0}"
          scan "Trivy (image)" "${IMG_C:-0}" "${IMG_H:-0}" "${IMG_M:-0}" "${IMG_L:-0}"
          scan "Gitleaks" "${LEAKS:-0}" 0 0 0
          if [ "${DC_RAN:-false}" = "true" ]; then
            scan "OWASP Dependency-Check" "${DC_C:-0}" "${DC_H:-0}" "${DC_M:-0}" "${DC_L:-0}"
          fi

          ALERTS=$(gh api --paginate "repos/${REPO}/code-scanning/alerts?state=open&per_page=100" 2>/dev/null | jq -s 'add // []' || echo '[]')
          count() { echo "$ALERTS" | jq "[.[] | select((.rule.security_severity_level // \"low\") == \"$1\")] | length"; }
          scan "CodeQL" "$(count critical)" "$(count high)" "$(count medium)" "$(count low)"
